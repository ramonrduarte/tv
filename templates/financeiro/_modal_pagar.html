<!-- Modal de pagamento com data -->
<div id="modal-pagar" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50" onclick="if(event.target===this)fecharModalPagar()">
  <div class="bg-white rounded-xl p-6 w-full max-w-sm shadow-xl mx-4">
    <h3 class="text-sm font-semibold text-slate-800 mb-4">Registrar Pagamento</h3>
    <form method="post" id="form-pagar-modal" action="">
      {% csrf_token %}
      <input type="hidden" name="next" id="modal-next" value="" />
      <div class="mb-5">
        <label for="modal-data" class="text-xs font-medium text-slate-600 block mb-1.5">Data do pagamento</label>
        <input type="date" name="data_pagamento" id="modal-data"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="flex gap-2 justify-end">
        <button type="button" onclick="fecharModalPagar()"
                class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-medium transition">
          Cancelar
        </button>
        <button type="submit"
                class="px-4 py-1.5 text-xs bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition">
          Confirmar Pagamento
        </button>
      </div>
    </form>
  </div>
</div>
<script>
  function abrirModalPagar(action, nextUrl) {
    const hoje = new Date().toISOString().split('T')[0];
    document.getElementById('modal-data').value = hoje;
    document.getElementById('form-pagar-modal').action = action;
    document.getElementById('modal-next').value = nextUrl || '';
    const modal = document.getElementById('modal-pagar');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }
  function fecharModalPagar() {
    const modal = document.getElementById('modal-pagar');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }
</script>
